name: CodePulse Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  codepulse-scan:
    name: CodePulse Security & Quality Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./api

      - name: Run CodePulse Scan
        id: scan
        run: |
          python -m api.cli.scanner \
            --repository . \
            --output-format json \
            --output-file codepulse-report.json \
            --fail-on-critical true
        continue-on-error: true

      - name: Generate SARIF Report
        if: always()
        run: |
          python -m api.cli.formatter \
            --input codepulse-report.json \
            --output codepulse-report.sarif \
            --format sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: codepulse-report.sarif
          category: codepulse-scan
          wait-for-processing: true

      - name: Post Results to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('codepulse-report.json', 'utf8'));

            const summary = report.summary || {};
            const critical = summary.critical || 0;
            const error = summary.error || 0;
            const warning = summary.warning || 0;

            let comment = `## 🔍 CodePulse Scan Results\n\n`;
            comment += `**Status:** ${critical > 0 ? '❌ FAILED' : error > 0 ? '⚠️ WARNING' : '✅ PASSED'}\n\n`;
            comment += `### Summary\n`;
            comment += `- 🔴 Critical: ${critical}\n`;
            comment += `- 🟠 Error: ${error}\n`;
            comment += `- 🟡 Warning: ${warning}\n\n`;

            if (critical > 0 || error > 0) {
              comment += `### Issues Found\n`;
              const findings = report.findings || [];
              const topIssues = findings.slice(0, 5);

              topIssues.forEach(issue => {
                comment += `- **${issue.rule}** (${issue.file}:${issue.line}) - ${issue.message}\n`;
              });

              if (findings.length > 5) {
                comment += `- ... and ${findings.length - 5} more issues\n`;
              }
            }

            comment += `\n[View full report](${context.payload.pull_request.html_url}/checks)`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Set Commit Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('codepulse-report.json', 'utf8'));
            const summary = report.summary || {};
            const critical = summary.critical || 0;
            const error = summary.error || 0;

            const state = critical > 0 ? 'failure' : error > 0 ? 'failure' : 'success';
            const description = `CodePulse: ${critical} critical, ${error} error issues found`;

            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              description: description,
              context: 'CodePulse Scan',
              target_url: `${context.payload.repository.html_url}/security/code-scanning?branch=${context.ref}`
            });

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codepulse-reports
          path: |
            codepulse-report.json
            codepulse-report.sarif
          retention-days: 30

      - name: Check Scan Results
        if: failure()
        run: |
          echo "❌ CodePulse scan failed - critical issues detected"
          exit 1
