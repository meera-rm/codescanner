version: '3.8'

services:
  # CodePulse API
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=api/main.py
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://codepulse:codepulse@postgres:5432/codepulse
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/phase6/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=codepulse
      - POSTGRES_PASSWORD=codepulse
      - POSTGRES_DB=codepulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codepulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (development)
  frontend:
    image: node:18-alpine
    working_dir: /app
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: codepulse_network
