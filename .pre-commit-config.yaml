repos:
  - repo: local
    hooks:
      - id: multi-language-scanner
        name: Multi-Language Code Scanner (Staged Files Only)
        entry: python3 codescanner/scanner.py
        language: system
        types: [python, javascript, sql]
        stages: [pre-commit]
        pass_filenames: true
        description: Scan staged files only (Python, JS, SQL) for critical issues
        fail_fast: true
