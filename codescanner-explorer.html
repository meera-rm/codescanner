<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeScanner Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            height: 100vh;
            padding: 20px;
        }

        .controls {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .controls h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #60a5fa;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .data-source {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 3px solid #60a5fa;
        }

        .data-source .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .data-source .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-indicator.offline {
            background: #64748b;
        }

        .status-indicator.live {
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .fetch-btn {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            border: 1px solid #2563eb;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .fetch-btn:hover:not(:disabled) {
            background: #2563eb;
        }

        .fetch-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .fetch-btn.loading {
            background: #1e40af;
        }

        .api-input {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #e2e8f0;
            font-size: 12px;
            font-family: "Monaco", "Menlo", monospace;
            margin-bottom: 8px;
        }

        .api-input::placeholder {
            color: #64748b;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-item,
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .radio-item:hover,
        .checkbox-item:hover {
            background: #334155;
        }

        input[type="radio"],
        input[type="checkbox"] {
            cursor: pointer;
            accent-color: #60a5fa;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        button.preset {
            padding: 10px;
            background: #334155;
            border: 1px solid #475569;
            color: #e2e8f0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        button.preset:hover {
            background: #475569;
            border-color: #64748b;
        }

        button.preset.active {
            background: #60a5fa;
            border-color: #60a5fa;
            color: #0f172a;
        }

        .preview {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #60a5fa;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
        }

        .stat-card.warning .value {
            color: #fbbf24;
        }

        .stat-card.warning {
            border-left-color: #fbbf24;
        }

        .stat-card.error .value {
            color: #ef4444;
        }

        .stat-card.error {
            border-left-color: #ef4444;
        }

        .issue-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .issue-item {
            padding: 10px;
            margin-bottom: 8px;
            background: #0f172a;
            border-left: 3px solid #475569;
            border-radius: 4px;
            font-size: 12px;
        }

        .issue-item.warning {
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.05);
        }

        .issue-item.error {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .issue-file {
            font-family: "Monaco", "Menlo", monospace;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: 4px;
        }

        .issue-type {
            display: inline-block;
            background: #334155;
            color: #cbd5e1;
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 11px;
            margin-right: 6px;
            font-family: "Monaco", "Menlo", monospace;
        }

        .issue-type.unused_import {
            background: #365a40;
            color: #86efac;
        }

        .issue-type.high_complexity {
            background: #5a3a30;
            color: #fdba74;
        }

        .issue-type.security {
            background: #5a2c2c;
            color: #fca5a5;
        }

        .issue-message {
            color: #cbd5e1;
            margin-top: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .empty-state h3 {
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .error-banner {
            background: #7f1d1d;
            border-left: 3px solid #dc2626;
            color: #fca5a5;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .error-banner strong {
            color: #fecaca;
        }

        .prompt-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #334155;
            padding: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .prompt-text {
            flex: 1;
            font-family: "Monaco", "Menlo", monospace;
            font-size: 13px;
            color: #60a5fa;
            word-break: break-all;
        }

        .copy-btn {
            padding: 8px 16px;
            background: #60a5fa;
            border: none;
            color: #0f172a;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #93c5fd;
        }

        .copy-btn.copied {
            background: #10b981;
        }

        .container-with-prompt {
            padding-bottom: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Controls Panel -->
        <div class="controls">
            <h2>🔧 CodeScanner Explorer</h2>

            <!-- Data Source Section -->
            <div class="data-source">
                <div class="label">Data Source</div>
                <div class="status">
                    <span class="status-indicator" id="statusIndicator"></span>
                    <span id="statusText">Standalone (Demo Data)</span>
                </div>
                <input type="text" class="api-input" id="apiUrl" placeholder="http://localhost:8000" value="http://localhost:8000">
                <button class="fetch-btn" id="fetchBtn" onclick="fetchLiveData()">
                    <span id="fetchBtnText">🔄 Fetch Live Data</span>
                </button>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" style="display: none;"></div>

            <!-- Severity Filter -->
            <div class="control-group">
                <label>Severity</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="severity" value="all" checked onchange="updateAll()">
                        All Issues
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="severity" value="warning" onchange="updateAll()">
                        Warnings Only
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="severity" value="error" onchange="updateAll()">
                        Errors Only
                    </label>
                </div>
            </div>

            <!-- Category Filter -->
            <div class="control-group">
                <label>Categories</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" name="category" value="unused_import" checked onchange="updateAll()">
                        Unused Imports
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="category" value="high_complexity" checked onchange="updateAll()">
                        High Complexity
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="category" value="security" onchange="updateAll()">
                        Security Issues
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" name="category" value="documentation" onchange="updateAll()">
                        Documentation
                    </label>
                </div>
            </div>

            <!-- Presets -->
            <div class="preset-buttons">
                <button class="preset active" onclick="applyPreset('all')">All Issues</button>
                <button class="preset" onclick="applyPreset('high-impact')">High Impact Only</button>
                <button class="preset" onclick="applyPreset('quick-wins')">Quick Wins</button>
                <button class="preset" onclick="applyPreset('complexity')">Complexity Focus</button>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="preview">
            <!-- Statistics -->
            <div class="stats">
                <div class="stat-card">
                    <h3>Total</h3>
                    <div class="value" id="statTotal">118</div>
                </div>
                <div class="stat-card warning">
                    <h3>Warnings</h3>
                    <div class="value" id="statWarnings">118</div>
                </div>
                <div class="stat-card error">
                    <h3>Errors</h3>
                    <div class="value" id="statErrors">0</div>
                </div>
            </div>

            <!-- Issues List -->
            <ul class="issue-list" id="issueList"></ul>
        </div>
    </div>

    <!-- Prompt Output -->
    <div class="prompt-section">
        <div class="prompt-text" id="promptText">/codescanner scan api</div>
        <button class="copy-btn" id="copyBtn" onclick="copyPrompt()">Copy</button>
    </div>

    <script>
        // Real data from CodeScanner api directory scan (fallback)
        const defaultIssues = [
            { file: "main.py", line: 38, type: "unused_import", message: "Import 'job_queue' is unused", severity: "WARNING" },
            { file: "auth_middleware.py", line: 4, type: "unused_import", message: "Import 'RateLimiter' is unused", severity: "WARNING" },
            { file: "pr_scan_task.py", line: 2, type: "unused_import", message: "Import 'os' is unused", severity: "WARNING" },
            { file: "pr_scan_task.py", line: 6, type: "unused_import", message: "Import 'Session' is unused", severity: "WARNING" },
            { file: "scanning.py", line: 2, type: "unused_import", message: "Import 'uuid' is unused", severity: "WARNING" },
            { file: "scanning.py", line: 19, type: "high_complexity", message: "Function 'scan_codebase_task' has complexity 16 (threshold: 10)", severity: "WARNING" },
            { file: "remote_handler.py", line: 7, type: "unused_import", message: "Import 'Optional' is unused", severity: "WARNING" },
            { file: "remote_handler.py", line: 25, type: "high_complexity", message: "Function 'download_github_repo' has complexity 17 (threshold: 10)", severity: "WARNING" },
            { file: "caqi_models.py", line: 3, type: "unused_import", message: "Import 'Dict' is unused", severity: "WARNING" },
            { file: "caqi_models.py", line: 3, type: "unused_import", message: "Import 'Optional' is unused", severity: "WARNING" },
            { file: "benchmark.py", line: 2, type: "unused_import", message: "Import 'datetime' is unused", severity: "WARNING" },
            { file: "scanner.py", line: 40, type: "high_complexity", message: "Function 'scan' has complexity 16 (threshold: 10)", severity: "WARNING" },
            { file: "formatter.py", line: 4, type: "unused_import", message: "Import 'Path' is unused", severity: "WARNING" },
            { file: "ci_dashboard.py", line: 5, type: "unused_import", message: "Import 'FileResponse' is unused", severity: "WARNING" },
            { file: "alerts.py", line: 5, type: "unused_import", message: "Import 'EmailStr' is unused", severity: "WARNING" },
            { file: "auth.py", line: 1, type: "unused_import", message: "Import 'Request' is unused", severity: "WARNING" },
            { file: "scanner.py", line: 11, type: "unused_import", message: "Import 'shutil' is unused", severity: "WARNING" },
            { file: "ci.py", line: 7, type: "unused_import", message: "Import 'Query' is unused", severity: "WARNING" },
            { file: "ci.py", line: 57, type: "high_complexity", message: "Function 'ci_scan' has complexity 12 (threshold: 10)", severity: "WARNING" },
            { file: "pr_scan_service.py", line: 42, type: "high_complexity", message: "Function 'scan_pr' has complexity 12 (threshold: 10)", severity: "WARNING" },
            { file: "agent_chain_executor.py", line: 39, type: "high_complexity", message: "Function 'evaluate' has complexity 13 (threshold: 10)", severity: "WARNING" },
            { file: "agent_chain_executor.py", line: 130, type: "high_complexity", message: "Function 'execute' has complexity 14 (threshold: 10)", severity: "WARNING" },
            { file: "team_aggregation_service.py", line: 168, type: "high_complexity", message: "Function '_map_to_archetype' has complexity 13 (threshold: 10)", severity: "WARNING" },
            { file: "dashboard.py", line: 188, type: "high_complexity", message: "Function 'get_dashboard_summary' has complexity 11 (threshold: 10)", severity: "WARNING" },
            { file: "scanner_service.py", line: 43, type: "high_complexity", message: "Function '_detect_language_from_directory' has complexity 11 (threshold: 10)", severity: "WARNING" },
            { file: "scanner_service.py", line: 102, type: "high_complexity", message: "Function 'scan' has complexity 20 (threshold: 10)", severity: "WARNING" },
            { file: "scanner_service.py", line: 196, type: "high_complexity", message: "Function '_get_scanned_files' has complexity 17 (threshold: 10)", severity: "WARNING" },
            { file: "git_risk_analyzer.py", line: 303, type: "high_complexity", message: "Function '_assess_file_risk_level' has complexity 11 (threshold: 10)", severity: "WARNING" },
            { file: "search_service.py", line: 13, type: "high_complexity", message: "Function 'search_scans' has complexity 12 (threshold: 10)", severity: "WARNING" },
            { file: "enterprise.py", line: 423, type: "high_complexity", message: "Function '_check_rate_limit' has complexity 11 (threshold: 10)", severity: "WARNING" },
            { file: "report_export_service.py", line: 82, type: "high_complexity", message: "Function 'generate_pdf_report' has complexity 11 (threshold: 10)", severity: "WARNING" }
        ];

        let allIssues = [...defaultIssues];
        let isLive = false;

        const state = {
            severity: "all",
            categories: ["unused_import", "high_complexity"]
        };

        function updateStatusIndicator() {
            const indicator = document.getElementById("statusIndicator");
            const text = document.getElementById("statusText");

            if (isLive) {
                indicator.className = "status-indicator live";
                text.textContent = "Live API Data";
            } else {
                indicator.className = "status-indicator offline";
                text.textContent = "Standalone (Demo Data)";
            }
        }

        async function fetchLiveData() {
            const apiUrl = document.getElementById("apiUrl").value || "http://localhost:8000";
            const fetchBtn = document.getElementById("fetchBtn");
            const fetchBtnText = document.getElementById("fetchBtnText");
            const errorBanner = document.getElementById("errorBanner");

            fetchBtn.disabled = true;
            fetchBtn.classList.add("loading");
            fetchBtnText.textContent = "⏳ Fetching...";
            errorBanner.style.display = "none";

            try {
                const response = await fetch(`${apiUrl}/api/v1/scan/sync`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        directory_path: "api",
                        language: "python",
                        options: { security: true, quality_score: true }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API responded with status ${response.status}`);
                }

                const data = await response.json();

                if (data.findings) {
                    // Transform API response to match our format
                    allIssues = data.findings.map(f => ({
                        file: f.file.split('/').pop(),
                        line: f.line,
                        type: f.type,
                        message: f.message,
                        severity: f.severity
                    }));

                    isLive = true;
                    updateStatusIndicator();
                    updateAll();

                    fetchBtnText.textContent = "✓ Live Data Loaded";
                    setTimeout(() => {
                        fetchBtnText.textContent = "🔄 Refresh Data";
                        fetchBtn.disabled = false;
                        fetchBtn.classList.remove("loading");
                    }, 2000);
                } else {
                    throw new Error("No findings in response");
                }
            } catch (error) {
                errorBanner.innerHTML = `<strong>❌ Error:</strong> Could not fetch from ${apiUrl}<br>${error.message}`;
                errorBanner.style.display = "block";
                fetchBtn.disabled = false;
                fetchBtn.classList.remove("loading");
                fetchBtnText.textContent = "🔄 Retry";
            }
        }

        function filterIssues() {
            return allIssues.filter(issue => {
                if (state.severity !== "all" && issue.severity.toLowerCase() !== state.severity) {
                    return false;
                }
                if (!state.categories.includes(issue.type)) {
                    return false;
                }
                return true;
            });
        }

        function updateAll() {
            state.severity = document.querySelector('input[name="severity"]:checked').value;
            state.categories = Array.from(document.querySelectorAll('input[name="category"]:checked')).map(el => el.value);

            renderPreview();
            updatePrompt();
        }

        function renderPreview() {
            const filtered = filterIssues();
            const warnings = filtered.filter(i => i.severity === "WARNING").length;
            const errors = filtered.filter(i => i.severity === "ERROR").length;

            document.getElementById("statTotal").textContent = filtered.length;
            document.getElementById("statWarnings").textContent = warnings;
            document.getElementById("statErrors").textContent = errors;

            const issueList = document.getElementById("issueList");
            if (filtered.length === 0) {
                issueList.innerHTML = `
                    <div class="empty-state">
                        <h3>No issues found</h3>
                        <p>Adjust filters to see results</p>
                    </div>
                `;
                return;
            }

            issueList.innerHTML = filtered.map(issue => `
                <li class="issue-item ${issue.severity.toLowerCase()}">
                    <div class="issue-file">${issue.file}:${issue.line}</div>
                    <span class="issue-type ${issue.type}">${formatType(issue.type)}</span>
                    <div class="issue-message">${issue.message}</div>
                </li>
            `).join("");
        }

        function formatType(type) {
            return type.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function updatePrompt() {
            const filtered = filterIssues();
            let prompt = "/codescanner scan api";

            const parts = [];
            if (state.severity === "warning") parts.push("warnings only");
            if (state.severity === "error") parts.push("errors only");
            if (state.categories.length < 2) {
                if (state.categories.includes("unused_import")) parts.push("show unused imports");
                if (state.categories.includes("high_complexity")) parts.push("show complexity issues");
            }

            if (parts.length > 0) {
                prompt += ` (${parts.join(", ")})`;
            }

            prompt += ` — found ${filtered.length} issue${filtered.length !== 1 ? 's' : ''}`;

            document.getElementById("promptText").textContent = prompt;
        }

        function applyPreset(preset) {
            document.querySelectorAll(".preset").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");

            switch (preset) {
                case "all":
                    document.querySelector('input[value="all"]').checked = true;
                    document.querySelectorAll('input[name="category"]').forEach(cb => cb.checked = true);
                    break;
                case "high-impact":
                    document.querySelector('input[value="error"]').checked = true;
                    document.querySelectorAll('input[name="category"]').forEach(cb => cb.checked = cb.value === "high_complexity");
                    break;
                case "quick-wins":
                    document.querySelector('input[value="warning"]').checked = true;
                    document.querySelectorAll('input[name="category"]').forEach(cb => cb.checked = cb.value === "unused_import");
                    break;
                case "complexity":
                    document.querySelector('input[value="all"]').checked = true;
                    document.querySelectorAll('input[name="category"]').forEach(cb => cb.checked = cb.value === "high_complexity");
                    break;
            }

            updateAll();
        }

        function copyPrompt() {
            const text = document.getElementById("promptText").textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById("copyBtn");
                btn.textContent = "Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                    btn.textContent = "Copy";
                    btn.classList.remove("copied");
                }, 2000);
            });
        }

        // Initialize
        updateStatusIndicator();
        updateAll();
    </script>
</body>
</html>
